<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UNIXA — UI Direction Gallery</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f5f4ef;
      --muted: #a8a7a1;
      --line: rgba(245, 244, 239, .16);
      --paper: #171717;
      --panel: #20201f;
      --accent: #d7ff3f;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      min-width: 320px;
      overflow: hidden;
      background: var(--paper);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button { font: inherit; }
    .app { display: grid; grid-template-columns: 290px minmax(0, 1fr); height: 100%; }
    .sidebar {
      display: flex;
      flex-direction: column;
      min-width: 0;
      padding: 26px 18px 18px;
      border-right: 1px solid var(--line);
      background: #111;
    }
    .eyebrow, .section-label { color: var(--accent); font-size: 10px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 8px 0 8px; font-size: clamp(25px, 3vw, 36px); letter-spacing: -.06em; line-height: .95; }
    .intro { max-width: 220px; margin: 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
    .section-label { margin: 34px 0 12px; color: var(--muted); }
    .variants { display: grid; gap: 6px; overflow: auto; padding-right: 3px; }
    .variant {
      display: grid;
      grid-template-columns: 29px minmax(0, 1fr) 12px;
      align-items: center;
      width: 100%;
      padding: 12px 10px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      text-align: left;
      transition: background .18s, border-color .18s, transform .18s;
    }
    .variant:hover { background: #242423; transform: translateX(2px); }
    .variant.active { border-color: var(--accent); background: #292b1c; }
    .variant-number { color: var(--accent); font-size: 10px; font-weight: 800; }
    .variant-name { min-width: 0; font-size: 14px; font-weight: 700; letter-spacing: -.02em; }
    .variant-arrow { color: var(--muted); font-size: 16px; }
    .variant.active .variant-arrow { color: var(--accent); }
    .hint { margin-top: auto; padding-top: 22px; color: var(--muted); font-size: 11px; line-height: 1.55; }
    kbd { display: inline-block; padding: 1px 4px; border: 1px solid var(--line); border-radius: 3px; font: inherit; color: var(--ink); }
    .main { display: grid; grid-template-rows: auto minmax(0, 1fr); min-width: 0; background: #0b0b0b; }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-width: 0;
      padding: 17px 24px;
      border-bottom: 1px solid var(--line);
      background: rgba(17,17,17,.92);
    }
    .current { min-width: 0; }
    .current-label { color: var(--muted); font-size: 10px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
    .current-name { overflow: hidden; margin-top: 3px; font-size: 16px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
    .controls { display: flex; gap: 8px; }
    .control {
      min-height: 34px;
      padding: 0 11px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
    }
    .control:hover { border-color: var(--accent); color: var(--accent); }
    .stage { position: relative; min-height: 0; padding: 18px; background: #0b0b0b; }
    .frame-shell { position: relative; width: 100%; height: 100%; overflow: hidden; border: 1px solid var(--line); border-radius: 10px; background: #fff; box-shadow: 0 14px 50px rgba(0,0,0,.35); }
    iframe { display: block; width: 100%; height: 100%; border: 0; background: white; }
    .loading { position: absolute; inset: 0; display: grid; place-items: center; background: #f5f4ef; color: #181818; font-size: 12px; font-weight: 700; transition: opacity .2s; pointer-events: none; }
    .loading.ready { opacity: 0; }
    .stage:fullscreen { padding: 0; background: #000; }
    .stage:fullscreen .frame-shell { border: 0; border-radius: 0; }
    @media (max-width: 740px) {
      body { overflow: auto; }
      .app { display: grid; grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); min-height: 100%; height: 100dvh; }
      .sidebar { display: grid; grid-template-columns: 1fr auto; gap: 0 18px; padding: 17px 14px 11px; border-right: 0; border-bottom: 1px solid var(--line); }
      h1 { margin: 4px 0; font-size: 27px; }
      .intro { display: none; }
      .section-label { grid-column: 1 / -1; margin: 13px 0 7px; }
      .variants { grid-column: 1 / -1; grid-row: 3; display: flex; gap: 7px; overflow-x: auto; padding: 0 0 3px; }
      .variant { display: flex; flex: 0 0 auto; gap: 7px; width: auto; padding: 8px 10px; }
      .variant-arrow { display: none; }
      .hint { display: none; }
      .topbar { padding: 11px 14px; }
      .stage { padding: 0; }
      .frame-shell { border: 0; border-radius: 0; box-shadow: none; }
      .current-name { font-size: 14px; }
      .control { padding: 0 9px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div>
        <div class="eyebrow">UNIXA / UI review</div>
        <h1>Pick a<br>direction.</h1>
        <p class="intro">A single place to compare every storefront concept before the team decides.</p>
      </div>
      <div class="section-label">8 concepts</div>
      <nav class="variants" id="variants" aria-label="UI concepts"></nav>
      <p class="hint">Use <kbd>←</kbd> <kbd>→</kbd> to move between concepts. Each one stays fully interactive.</p>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="current">
          <div class="current-label">Now viewing</div>
          <div class="current-name" id="currentName">—</div>
        </div>
        <div class="controls">
          <button class="control" id="previous" type="button" aria-label="Previous concept">←</button>
          <button class="control" id="next" type="button" aria-label="Next concept">→</button>
          <button class="control" id="fullscreen" type="button">Full screen</button>
        </div>
      </header>
      <section class="stage" id="stage" aria-label="UI preview">
        <div class="frame-shell">
          <iframe id="preview" title="Selected UNIXA UI concept"></iframe>
          <div class="loading" id="loading">Loading preview…</div>
        </div>
      </section>
    </main>
  </div>
  <script>
    const concepts = [
      { name: 'Swiss SS26', file: 'variants/01-swiss-ss26.html' },
      { name: 'Store', file: 'variants/02-store.html' },
      { name: 'Wall', file: 'variants/03-wall.html' },
      { name: 'Zine Photos', file: 'variants/04-zine-photos.html' },
      { name: 'Pop Art', file: 'variants/05-pop-art.html' },
      { name: 'Classic', file: 'variants/06-classic.html' },
      { name: 'Y2K Storefront', file: 'variants/07-y2k-storefront.html' },
      { name: 'Sheer Hours', file: 'variants/08-sheer-hours.html' }
    ];
    const variants = document.getElementById('variants');
    const preview = document.getElementById('preview');
    const loading = document.getElementById('loading');
    const currentName = document.getElementById('currentName');
    const stage = document.getElementById('stage');
    let activeIndex = 0;

    function renderMenu() {
      variants.innerHTML = concepts.map((concept, index) => `
        <button class="variant" type="button" data-index="${index}" aria-label="Open ${concept.name}">
          <span class="variant-number">0${index + 1}</span>
          <span class="variant-name">${concept.name}</span>
          <span class="variant-arrow">↗</span>
        </button>`).join('');
      variants.addEventListener('click', (event) => {
        const button = event.target.closest('[data-index]');
        if (button) selectConcept(Number(button.dataset.index));
      });
    }

    function selectConcept(index) {
      activeIndex = (index + concepts.length) % concepts.length;
      const concept = concepts[activeIndex];
      currentName.textContent = `0${activeIndex + 1} — ${concept.name}`;
      document.querySelectorAll('.variant').forEach((button, buttonIndex) => {
        const active = buttonIndex === activeIndex;
        button.classList.toggle('active', active);
        button.setAttribute('aria-current', active ? 'page' : 'false');
      });
      loading.classList.remove('ready');
      preview.src = concept.file;
      document.querySelector(`.variant[data-index="${activeIndex}"]`)?.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: 'smooth' });
    }

    preview.addEventListener('load', () => loading.classList.add('ready'));
    document.getElementById('previous').addEventListener('click', () => selectConcept(activeIndex - 1));
    document.getElementById('next').addEventListener('click', () => selectConcept(activeIndex + 1));
    document.getElementById('fullscreen').addEventListener('click', () => {
      if (document.fullscreenElement) document.exitFullscreen();
      else stage.requestFullscreen();
    });
    document.addEventListener('fullscreenchange', () => {
      document.getElementById('fullscreen').textContent = document.fullscreenElement ? 'Exit full screen' : 'Full screen';
    });
    document.addEventListener('keydown', (event) => {
      if (event.target.matches('input, textarea, select')) return;
      if (event.key === 'ArrowLeft') selectConcept(activeIndex - 1);
      if (event.key === 'ArrowRight') selectConcept(activeIndex + 1);
    });

    renderMenu();
    selectConcept(0);
  </script>
</body>
</html>
