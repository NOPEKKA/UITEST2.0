<style>
  html, body { margin: 0; background: #f2f3f5; color: #0c0d10; }
  .boot { min-height: 60vh; display: grid; place-items: center; font: 500 11px/1.3 "Geist Mono", ui-monospace, monospace; letter-spacing: .14em; text-transform: uppercase; color: #525864; }

<body>
<div id="root"><p class="boot">UNIXA — loading the grid…</p></div>
<noscript><p class="boot">UNIXA needs JavaScript to open the store.</p></noscript>
<script>
/* Seed photography — drives the app's own real "paste a photo" path (hover the slot, then
   paste) for every product slot that doesn't have a photo yet, so it goes through the same
   optimistic blob-preview + persistence the app already uses for a genuine upload. No reload,
   no reaching into its storage schema directly. A real upload always wins (skipped if present). */
(function(){
  var ASSIGN = {
    "UX-2601": "05-leopard-signal-tie.png", "UX-2602": "07-rivet-visor.png", "UX-2603": "30-rodeo-rivet-zip.png",
    "UX-2604": "19-ivory-cross-highs.png", "UX-2605": "23-utility-ruin-jacket.png", "UX-2606": "11-rope-cross-boots.png",
    "UX-2607": "31-toxic-spider-knit.png", "UX-2608": "21-chrome-snow-boots.png", "UX-2609": "16-spiked-static-cap.png",
    "UX-2610": "13-chain-laced-dc.png", "UX-2611": "25-bane-blade-shades.png", "UX-2612": "15-wired-portrait-denim.png",
    "UX-2613": "32-indigo-spider-knit.png", "UX-2614": "09-ghost-zebra-zip.png", "UX-2615": "20-cloudbound-boots.png",
    "UX-2616": "08-orbit-spike-shades.png", "UX-2617": "29-tiger-pocket-shorts.png", "UX-2618": "12-nocturne-puffer-mules.png",
    "UX-2619": "10-fog-camo-bomber.png"
  };
  var inflight = new WeakSet();
  var fileCache = {};
  function getFile(name){
    return fileCache[name] || (fileCache[name] = fetch("../assets/user-catalog/" + name)
      .then(function(r){ return r.blob(); })
      .then(function(blob){ return new File([blob], name, {type: blob.type || "image/png"}); }));
  }
  function seedSlot(slot){
    var pid = slot.getAttribute("data-photo-target");
    var name = ASSIGN[pid];
    if (!name || slot.querySelector("img") || inflight.has(slot)) return;
    inflight.add(slot);
    setTimeout(function(){ inflight.delete(slot); }, 350);
    slot.dispatchEvent(new MouseEvent("mouseover", {bubbles:true}));
    slot.dispatchEvent(new MouseEvent("mousemove", {bubbles:true}));
    getFile(name).then(function(file){
      var dt = new DataTransfer(); dt.items.add(file);
      var evt;
      try { evt = new ClipboardEvent("paste", {bubbles:true, cancelable:true, clipboardData:dt}); }
      catch(e){ evt = new Event("paste", {bubbles:true, cancelable:true}); Object.defineProperty(evt, "clipboardData", {value:dt}); }
      document.dispatchEvent(evt);
    }).catch(function(){});
  }
  function sweep(){
    document.querySelectorAll("[data-photo-target]").forEach(seedSlot);
  }
  var interval = null, tries = 0;
  function pollAWhile(){
    tries = 0;
    if (interval) clearInterval(interval);
    interval = setInterval(function(){
      sweep();
      if (++tries >= 12) clearInterval(interval);
    }, 400);
  }
  pollAWhile();
  new MutationObserver(function(){ sweep(); }).observe(document.body, {childList:true, subtree:true});
  window.addEventListener("hashchange", pollAWhile);
})();
</script>
